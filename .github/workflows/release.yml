name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Tests
        run: |
          /usr/bin/osascript -l JavaScript tests/unit.js server/seafile-mcp.js
          python3 tests/protocol.py

      - name: Set the version from the tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          jq --arg v "$VER" --arg r "https://github.com/${GITHUB_REPOSITORY}.git" \
            '.version=$v | .repository.url=$r' manifest.json > m.tmp && mv m.tmp manifest.json
          grep -q "^var VERSION = '" server/seafile-mcp.js
          sed -i '' "s/^var VERSION = '[^']*';/var VERSION = '$VER';/" server/seafile-mcp.js
          grep "^var VERSION" server/seafile-mcp.js

      - name: Validate and pack
        run: |
          npx -y @anthropic-ai/mcpb validate manifest.json
          npx -y @anthropic-ai/mcpb pack . seafile-mcp.mcpb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" seafile-mcp.mcpb \
            --title "$GITHUB_REF_NAME" --generate-notes

  # Every release is listed in the MCP Registry.
  registry:
    needs: bundle
    if: ${{ !github.event.repository.private }} # the registry links to the release file, which must be public
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/registry.yml
    with:
      tag: ${{ github.ref_name }}
